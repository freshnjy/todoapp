# 기존 nginx 설정(/etc/nginx/sites-enabled/my-run-coach-ai)의 443 server 블록 안에 "추가"할 부분이다.
# 이 파일 전체를 include 하는 것이 아니라, 아래 두 location 블록을 복사해서 server { ... } 안에 붙여 넣는다.
# 기존 location /, /runcoach/, /runcoach-api/, /bridge/ 는 건드리지 않는다.
# 붙여 넣는 방법과 되돌리는 방법은 docs/deploy.md 5번.

# /todo (끝 슬래시 없음) -> /todo/
location = /todo {
    auth_basic off;
    return 301 /todo/;
}

# 할 일 앱. 이 location에는 브라우저 비밀번호 창(Basic 인증)을 걸지 않는다.
# 앱이 자체 로그인(비밀번호 + 30일 기기 쿠키)으로 직접 지킨다.
# 반드시 앱에 로그인이 들어간 버전(1-2단계)을 띄운 뒤에 off로 바꾼다.
location /todo/ {
    auth_basic off;

    # proxy_pass 끝의 /가 /todo/ 접두사를 떼고 넘기게 한다.
    # (/todo/api/health -> http://127.0.0.1:8003/api/health)
    proxy_pass http://127.0.0.1:8003/;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
