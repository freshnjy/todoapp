# 기존 nginx 설정(/etc/nginx/sites-enabled/my-run-coach-ai)의 443 server 블록 안에 "추가"할 부분이다.
# 이 파일 전체를 include 하는 것이 아니라, 아래 두 location 블록을 복사해서 server { ... } 안에 붙여 넣는다.
# 기존 location /, /runcoach/, /runcoach-api/, /bridge/ 는 건드리지 않는다.
# 붙여 넣는 방법과 되돌리는 방법은 docs/deploy.md 4번.

# /todo (끝 슬래시 없음) -> /todo/
location = /todo {
    return 301 /todo/;
}

# 할 일 앱.
# 1-1단계(지금): 앱에 로그인이 아직 없으므로 기존 브라우저 비밀번호 창(Basic 인증)으로 막는다.
#   기존 설정의 auth_basic 두 줄이 server 블록에 있으면 그대로 물려받으므로 아래 두 줄은 필요 없다.
#   location / 안에 있으면 물려받지 못하므로, 그 두 줄을 그대로 복사해 아래 주석 자리에 넣는다.
# 1-2단계: 앱에 자체 로그인이 생기면 그 두 줄을 지우고 `auth_basic off;` 한 줄로 바꾼다.
location /todo/ {
    # auth_basic "...";                  # 기존 설정에서 복사
    # auth_basic_user_file ...;          # 기존 설정에서 복사

    # proxy_pass 끝의 /가 /todo/ 접두사를 떼고 넘기게 한다.
    # (/todo/api/health -> http://127.0.0.1:8003/api/health)
    proxy_pass http://127.0.0.1:8003/;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
