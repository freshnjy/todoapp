<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 할 일</title>
  <link rel="stylesheet" href="style.css">
  <!-- habits.js와 memos.js가 먼저다: app.js가 시작할 때 두 파일의 함수를 쓴다 -->
  <script src="habits.js" defer></script>
  <script src="memos.js" defer></script>
  <script src="app.js" defer></script>
  <!-- voice.js는 app.js 다음이다: app.js의 함수와 상태를 쓴다 -->
  <script src="voice.js" defer></script>
</head>
<body>
  <main class="app">
    <!-- 헤더: 앱 이름과 오늘 날짜, 오른쪽에 화면 전환(오늘 할 일 / 습관 / 저장소) -->
    <header class="header">
      <div class="header-text">
        <h1 class="header-title">오늘 할 일</h1>
        <p class="header-date" id="today"></p>
      </div>
      <nav class="tabs status-tabs view-tabs" id="view-tabs" aria-label="화면 전환">
        <button class="tab is-active" type="button" data-view="today" aria-pressed="true">오늘</button>
        <button class="tab" type="button" data-view="habits" aria-pressed="false">습관</button>
        <button class="tab" type="button" data-view="memos" aria-pressed="false">저장소</button>
      </nav>
    </header>

    <!-- 서버와 연결하지 못했을 때의 안내 (app.js가 채움) -->
    <p class="notice" id="notice" role="alert" hidden></p>

    <div id="view-today">

    <!-- 통계: 선택한 탭의 진행률 (카테고리별 개수는 아래 카테고리 탭의 숫자로 본다) -->
    <section class="card stats" id="stats" data-filter="all" aria-label="진행 현황">
      <div class="stats-head">
        <div>
          <p class="stats-label" id="stats-label">전체 진행률</p>
          <p class="stats-summary" id="progress-text" aria-live="polite"></p>
        </div>
        <p class="stats-percent" id="stats-percent" aria-hidden="true">0%</p>
      </div>
      <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <!-- 입력 영역. 평소에는 첫 줄(입력창, 마이크, 추가)만 보인다. 입력창을 누르거나 적기 시작하면 나머지가 펼쳐진다 (app.js) -->
    <form class="card add-form is-collapsed" id="add-form">
      <!-- 마이크는 음성 인식을 쓸 수 있는 브라우저에서만 보인다 (voice.js) -->
      <div class="add-main">
        <input class="add-input" id="add-input" type="text" maxlength="100"
               placeholder="할 일을 입력하세요" aria-label="할 일 내용" autocomplete="off" autofocus>
        <button class="btn voice-btn" id="voice-btn" type="button" aria-label="말로 입력" aria-pressed="false" hidden>
          <svg class="voice-icon" viewBox="3 1.5 18 21" width="26" height="30" aria-hidden="true">
            <path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5z" fill="currentColor"/>
            <path d="M18.5 11a6.5 6.5 0 0 1-13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="btn btn-primary add-submit" type="submit">추가</button>
      </div>
      <!-- 듣는 동안의 표시와 받아 적은 글 (voice.js가 채움) -->
      <div class="voice-panel" id="voice-panel" hidden>
        <p class="voice-status" id="voice-status" aria-live="polite"></p>
        <p class="voice-heard" id="voice-heard"></p>
        <button class="btn btn-primary voice-big" id="voice-big" type="button" hidden>눌러서 말하기</button>
      </div>
      <!-- 접히는 부분: 카테고리·반복, 묶음 고르기, 새 묶음 만들기 -->
      <div class="add-more" id="add-more">
        <!-- 고를 것: 카테고리와 반복을 한 줄에. 묶음을 고르면 감춘다 -->
        <div class="add-options" id="add-options">
          <select class="add-category" id="add-category" aria-label="카테고리">
            <option value="work">업무</option>
            <option value="personal">개인</option>
            <option value="growth">성장</option>
          </select>
          <!-- 반복 설정 (app.js가 채움). 반복을 고르면 루틴으로 저장된다 -->
          <div id="add-rule"></div>
        </div>
        <!-- 묶음 고르기 (app.js가 채움). 하나를 고르고 입력하면 그 묶음의 품목으로 들어간다 -->
        <div class="group-bar" id="group-bar" role="group" aria-label="넣을 묶음"></div>
        <!-- 새 묶음 만들기: "+ 묶음"을 누르면 보인다 -->
        <div class="group-new" id="group-new" hidden>
          <input class="add-input" id="group-name" type="text" maxlength="20"
                 placeholder="묶음 이름 (예: 장보기)" aria-label="새 묶음 이름" autocomplete="off">
          <div class="add-row">
            <select class="add-category" id="group-category" aria-label="새 묶음의 카테고리">
              <option value="work">업무</option>
              <option value="personal" selected>개인</option>
              <option value="growth">성장</option>
            </select>
            <button class="btn btn-primary" id="group-create" type="button">만들기</button>
            <button class="btn" id="group-cancel" type="button">취소</button>
          </div>
        </div>
      </div>
    </form>

    <!-- 필터 탭 -->
    <nav class="tabs" id="tabs" aria-label="카테고리 필터">
      <button class="tab is-active" type="button" data-filter="all" aria-pressed="true">전체 <span class="tab-count">0</span></button>
      <button class="tab" type="button" data-filter="work" aria-pressed="false">업무 <span class="tab-count">0</span></button>
      <button class="tab" type="button" data-filter="personal" aria-pressed="false">개인 <span class="tab-count">0</span></button>
      <button class="tab" type="button" data-filter="growth" aria-pressed="false">성장 <span class="tab-count">0</span></button>
    </nav>

    <!-- 상태 필터 (카테고리 탭과 함께 적용) -->
    <nav class="tabs status-tabs" id="status-tabs" aria-label="상태 필터">
      <button class="tab is-active" type="button" data-status="all" aria-pressed="true">전체</button>
      <button class="tab" type="button" data-status="active" aria-pressed="false">미완료</button>
      <button class="tab" type="button" data-status="done" aria-pressed="false">완료</button>
    </nav>

    <!-- 목록 (app.js의 render()가 채움). 루틴과 묶음이 하나도 없으면 그 구역과 "할 일" 제목은 감춘다 -->
    <div id="lists">
      <section class="routine-section" id="routine-section" aria-labelledby="routine-title" hidden>
        <h2 class="section-title" id="routine-title">오늘의 루틴</h2>
        <ul class="todo-list" id="routine-list"></ul>
        <p class="empty empty-small" id="routine-empty" hidden></p>
        <details class="rest" id="rest" hidden>
          <summary id="rest-summary"></summary>
          <ul class="todo-list" id="rest-list"></ul>
        </details>
      </section>

      <!-- 묶음: 한 줄로 접혀 있고, 누르면 품목이 펼쳐진다 -->
      <section class="group-section" id="group-section" aria-labelledby="group-title" hidden>
        <h2 class="section-title" id="group-title">묶음</h2>
        <ul class="todo-list" id="group-list"></ul>
      </section>

      <h2 class="section-title" id="todo-title" hidden>할 일</h2>
      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty" id="empty" hidden></p>
    </div>

    <button class="btn btn-danger btn-clear" id="clear-done" type="button" hidden>완료 항목 지우기</button>
    </div>

    <!-- 습관: 루틴별 달성 기록 (habits.js가 채움) -->
    <section id="view-habits" aria-label="습관" hidden>
      <!-- 한 줄에: 기간 넘기기 + 주간/월간 -->
      <div class="habit-toolbar">
        <div class="habit-nav">
          <button class="btn" id="habit-prev" type="button" aria-label="이전 기간">‹</button>
          <p class="habit-period" id="habit-period" aria-live="polite"></p>
          <button class="btn" id="habit-next" type="button" aria-label="다음 기간">›</button>
        </div>
        <nav class="tabs status-tabs habit-modes" id="habit-modes" aria-label="보기 기간">
          <button class="tab is-active" type="button" data-mode="week" aria-pressed="true">주간</button>
          <button class="tab" type="button" data-mode="month" aria-pressed="false">월간</button>
        </nav>
      </div>
      <ul class="habit-list" id="habit-list"></ul>
      <p class="empty" id="habit-empty" hidden></p>
      <p class="habit-legend" id="habit-legend">● 한 날 · 빈칸은 안 한 날 · 흐린 칸은 쉬는 날. 칸을 누르면 표시하거나 지울 수 있어요.</p>
    </section>

    <!-- 저장소: 생각난 것을 남겨 두는 메모 (memos.js가 채움). 마지막으로 고친 메모가 위에 온다 -->
    <section id="view-memos" aria-label="저장소" hidden>
      <button class="btn btn-primary memo-new" id="memo-new" type="button">+ 새 메모</button>
      <ul class="memo-list" id="memo-list"></ul>
      <p class="empty" id="memo-empty" hidden></p>
    </section>

    <!-- 말로 넣은 뒤의 알림: "장보기에 '우유' 추가함 · 취소" (voice.js가 채움) -->
    <div class="toast" id="toast" role="status" hidden>
      <p class="toast-text" id="toast-text"></p>
      <button class="btn btn-small toast-action" id="toast-action" type="button"></button>
      <button class="btn btn-small toast-close" id="toast-close" type="button" aria-label="닫기">✕</button>
    </div>

    <footer class="footer">
      <button class="btn btn-small btn-logout" id="logout" type="button">로그아웃</button>
    </footer>
  </main>
</body>
</html>
